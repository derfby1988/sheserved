# Scenario 6: Scope isolation — verify Personal vs Organization Override isolation
# Covers: migration guide section 10.3 (CRUD and scope isolation)
# Prerequisites:
#   - App is installed on the device
#   - Network connectivity to Supabase backend
#   - USER_A: user with can_manage_drug_risk=true (Organization mode)
#   - USER_B: different user with can_manage_drug_risk=true but different profession
#   - Both users must NOT be admins
# Environment:
#   - USER_A_USERNAME: org user A (default: "apisek")
#   - USER_A_PASSWORD: password (default: "123456")
#   - USER_B_USERNAME: org user B with different profession (default: "firm")
#   - USER_B_PASSWORD: password (default: "123456")
#   - MEDICATION_NAME: medication to test (default: "Paracetamol")

appId: com.sheserved.app
env:
  USER_A_USERNAME: "apisek"
  USER_A_PASSWORD: "123456"
  USER_B_USERNAME: "firm"
  USER_B_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Login as User A and create Organization Override
# ═══════════════════════════════════════════
- launchApp:
    appId: com.sheserved.app
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "270,1278"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_A_USERNAME}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_A_PASSWORD}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "ค้นหาการบริจาค..."
    timeout: 60000

# Navigate to drug risk page
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Search medication
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Set Organization Override
- extendedWaitUntil:
    visible: ".*Override.*"
    timeout: 30000

- tapOn: ".*ตั้งค่า.*Override.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: 'Override:.*'

# Change FDA Risk Status
- tapOn:
    text: "FDA Risk Status.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "S (ยาควบคุมพิเศษ)"
- waitForAnimationToEnd:
    timeout: 2000

# Fill reason
- tapOn:
    text: "เหตุผลการ Override เพื่อบันทึกประวัติ *"
- waitForAnimationToEnd:
    timeout: 1000
- setClipboard: "Scope isolation test - Org Override by User A"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000

# Save
- tapOn: "บันทึก Override"
- waitForAnimationToEnd:
    timeout: 10000

# Dismiss keyboard
- tapOn:
    point: "400,75"
- waitForAnimationToEnd:
    timeout: 2000

# Re-search to verify badge
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Verify Organization Override badge appears for User A
- extendedWaitUntil:
    visible: ".*Override องค์กร.*"
    timeout: 15000
- assertVisible: ".*Override องค์กร.*"

# ═══════════════════════════════════════════
# Step 2: Kill app and login as User B (different profession)
# ═══════════════════════════════════════════
- killApp:
    appId: com.sheserved.app

- waitForAnimationToEnd:
    timeout: 3000

- launchApp:
    appId: com.sheserved.app

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "270,1278"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_B_USERNAME}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_B_PASSWORD}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "ค้นหาการบริจาค..."
    timeout: 60000

# Navigate to drug risk page
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Search same medication
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# ═══════════════════════════════════════════
# Step 3: Verify User B does NOT see User A's Organization Override
# ═══════════════════════════════════════════
# User B has a different profession, so User A's Org Override should NOT be visible
# Wait for search results — check that User A's specific override badge is NOT shown
- waitForAnimationToEnd:
    timeout: 5000

# If User B's profession differs from User A's, the Organization Override badge
# from User A's profession should not appear. User B may see their own scope or no override.
# This assertion verifies scope isolation — User B should not see User A's org-scoped override
- assertNotVisible: ".*Override องค์กร.*S.*"

# ═══════════════════════════════════════════
# Step 4: User B creates Personal Override — verify isolation
# ═══════════════════════════════════════════
- extendedWaitUntil:
    visible: ".*Override.*"
    timeout: 30000

- tapOn: ".*ตั้งค่า.*Override.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: 'Override:.*'

# Change FDA Risk Status to different value
- tapOn:
    text: "FDA Risk Status.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "D (ยาอันตราย)"
- waitForAnimationToEnd:
    timeout: 2000

# Fill reason
- tapOn:
    text: "เหตุผลการ Override เพื่อบันทึกประวัติ *"
- waitForAnimationToEnd:
    timeout: 1000
- setClipboard: "Scope isolation test - Personal Override by User B"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000

# Save
- tapOn: "บันทึก Override"
- waitForAnimationToEnd:
    timeout: 10000

# Dismiss keyboard
- tapOn:
    point: "400,75"
- waitForAnimationToEnd:
    timeout: 2000

# Re-search to verify Personal Override badge
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Verify Personal Override badge appears for User B
- extendedWaitUntil:
    visible: ".*Override ส่วนตัว.*"
    timeout: 15000
- assertVisible: ".*Override ส่วนตัว.*"

# ═══════════════════════════════════════════
# Step 5: Kill app and re-login as User A — verify Personal Override of User B is not visible
# ═══════════════════════════════════════════
- killApp:
    appId: com.sheserved.app

- waitForAnimationToEnd:
    timeout: 3000

- launchApp:
    appId: com.sheserved.app

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "270,1278"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_A_USERNAME}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${USER_A_PASSWORD}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "ค้นหาการบริจาค..."
    timeout: 60000

# Navigate to drug risk page
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Search same medication
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# User A should see their own Organization Override, NOT User B's Personal Override
- extendedWaitUntil:
    visible: ".*Override องค์กร.*"
    timeout: 15000
- assertVisible: ".*Override องค์กร.*"

# User A should NOT see User B's Personal Override value (D - ยาอันตราย)
# The effective value for User A should be from their Organization Override (S - ยาควบคุมพิเศษ)
- assertNotVisible: ".*Override ส่วนตัว.*D.*"
