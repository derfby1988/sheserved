# Scenario 4: Custom profession with can_manage_drug_risk=false sees Personal mode
# Covers: migration guide section 10.2 test 3 (custom + flag false) and 10.3 test 3 (blocked from Org Override)
# Prerequisites:
#   - App is installed on the device
#   - Network connectivity to Supabase backend
#   - NO_CAP_USERNAME must be a user whose profession has can_manage_drug_risk=false
#   - The user should NOT be a consumer (to verify non-consumer + no capability = Personal mode)
# Environment:
#   - NO_CAP_USERNAME: username for user without drug risk capability (default: "nurse")
#   - NO_CAP_PASSWORD: password (default: "123456")
#   - MEDICATION_NAME: medication to search (default: "Paracetamol")

appId: com.sheserved.app
env:
  NO_CAP_USERNAME: "nurse"
  NO_CAP_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Login as user without drug risk capability
# ═══════════════════════════════════════════
- launchApp:
    appId: com.sheserved.app
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Navigate to login via bottom nav donation tab
- tapOn:
    point: "270,1278"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${NO_CAP_USERNAME}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${NO_CAP_PASSWORD}"

- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000

# ═══════════════════════════════════════════
# Step 2: Navigate to drug risk page
# ═══════════════════════════════════════════
- extendedWaitUntil:
    visible: "ค้นหาการบริจาค..."
    timeout: 60000

# Open drawer
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

# ═══════════════════════════════════════════
# Step 3: Verify Personal mode (not Organization, not Global Admin)
# ═══════════════════════════════════════════
# User with can_manage_drug_risk=false should see Personal mode
- assertVisible: 'จัดการความเสี่ยงยา \(Personal\)'

# Wait for loading to finish
- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Should NOT see Organization mode tabs
- assertNotVisible: ".*Organization.*|.*องค์กร.*"

# ═══════════════════════════════════════════
# Step 4: Search medication and verify Personal Override only
# ═══════════════════════════════════════════
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Wait for Override button to appear
- extendedWaitUntil:
    visible: ".*Override.*"
    timeout: 30000

# User should be able to set Personal Override
- tapOn: ".*ตั้งค่า.*Override.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: 'Override:.*'

# Verify dialog shows Personal scope (not Organization)
- assertVisible: ".*ส่วนตัว.*"
- assertNotVisible: ".*องค์กร.*"

# Change FDA Risk Status
- tapOn:
    text: "FDA Risk Status.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "D (ยาอันตราย)"
- waitForAnimationToEnd:
    timeout: 2000

# Fill reason field
- tapOn:
    text: "เหตุผลการ Override เพื่อบันทึกประวัติ *"
- waitForAnimationToEnd:
    timeout: 1000
- setClipboard: "Test Personal Override - no capability user"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000

# Save override
- tapOn: "บันทึก Override"
- waitForAnimationToEnd:
    timeout: 10000

# Dismiss keyboard by tapping app bar area (not hideKeyboard — it sends back button)
- tapOn:
    point: "400,75"
- waitForAnimationToEnd:
    timeout: 2000

# Re-search to verify Personal Override badge
- tapOn:
    point: "400,330"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- setClipboard: "${MEDICATION_NAME}"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Verify Personal Override badge appears (not Organization)
- extendedWaitUntil:
    visible: ".*Override ส่วนตัว.*"
    timeout: 15000
- assertVisible: ".*Override ส่วนตัว.*"

# ═══════════════════════════════════════════
# Step 5: Verify user cannot access Organization Override
# ═══════════════════════════════════════════
# The UI should not show Organization Override option
# If there's an Organization tab, it should not be visible or tappable
- assertNotVisible: ".*Override องค์กร.*"
