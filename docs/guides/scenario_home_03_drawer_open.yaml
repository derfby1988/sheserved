# HOME-03: Drawer เปิดได้ แสดงเมนูตาม role
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "sister" has password 123456, role=provider
#
# Expected:
#   - Drawer opens when tapping hamburger icon
#   - Drawer shows user info and menu items appropriate for provider role
#
# Run:
#   maestro test docs/guides/scenario_home_03_drawer_open.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - home
env:
  USERNAME: "sister"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Open drawer via hamburger icon
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

# Step 3: Verify drawer is open — should see menu items
- assertVisible: ".*ออกจากระบบ.*|.*โปรไฟล์.*|.*คำขอโปรแกรมรักษา.*"

# Scroll to see more items
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# Verify logout is visible at bottom
- assertVisible: "ออกจากระบบ"
