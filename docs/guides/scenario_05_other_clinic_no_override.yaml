# Scenario 5: องค์กรไม่มี Override ใดๆ (คลินิก B ไม่เห็น Override ของคลินิก A)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# This flow logs in with a user from clinic B (different profession_id from apisek),
# searches for Paracetamol (which has Override set by clinic A in Scenario 2),
# and verifies that the card shows default values with NO Override badge and NO Last-Modified Banner.
#
# Prerequisites:
#   - Scenario 2 must have been run first (apisek set Override for Paracetamol in clinic A)
#   - User "sister" must have a different profession_id from apisek (clinic B)
#   - User "sister" must have can_manage_drug_risk = true
#
# Credentials:
#   - Clinic B user: sister / 123456
#
# Run:
#   maestro test docs/guides/scenario_05_other_clinic_no_override.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 5
#   - lib/features/pharmacy/presentation/pages/drug_risk_classification_admin_page.dart

appId: com.example.treeLawZoo
env:
  CLINIC_B_USERNAME: "sister"
  CLINIC_B_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and login as clinic B user (sister)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CLINIC_B_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    below:
      text: "รหัสผ่าน"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CLINIC_B_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: ".*ยินดีต้อนรับ.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"

- extendedWaitUntil:
    visible:
      text: ".*ค้นหาการบริจาค.*"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Verify login and navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 3: Search Paracetamol and verify NO Override badge
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# ✅ Verify NO Override badge (clinic B should not see clinic A's override)
- assertNotVisible: ".*Override องค์กร.*"
- assertNotVisible: ".*Override ส่วนตัว.*"

# ✅ Verify NO Last-Modified Banner
- assertNotVisible: ".*แก้ไขล่าสุดโดย.*"
- assertNotVisible: ".*ตั้งค่าโดยอดีตเจ้าหน้าที่.*"
- assertNotVisible: ".*ดูแลโดย System Admin.*"
