# AUTH-06: Register wizard flow — ลงทะเบียนผู้ใช้ใหม่ครบทุกขั้นตอน
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - App is connected to live Supabase backend
#
# Expected:
#   - Navigate to register wizard from login
#   - Step 0: ข้อมูลทั่วไป (ชื่อจริง, นามสกุล, เลือกประเภท)
#   - Step 1: ข้อมูลเข้าสู่ระบบ (ชื่อผู้ใช้, รหัสผ่าน)
#   - Verify wizard loads with step 0 fields visible
#
# Run:
#   maestro test docs/guides/scenario_auth_06_register_wizard.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - registration
  - auth
env:
  NEW_USERNAME: "testuser_maestro"
  NEW_PASSWORD: "123456"
  NEW_PHONE: "0899999999"
  NEW_FULLNAME: "Test User Maestro"
---
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Navigate to login page
- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

# Tap "ลงทะเบียน" link
- tapOn: "ลงทะเบียน"
- waitForAnimationToEnd:
    timeout: 3000

# Verify register wizard page loaded — step 0 title
- extendedWaitUntil:
    visible: ".*ข้อมูลทั่วไป.*|.*ลงทะเบียน.*"
    timeout: 15000

# Step 0: ข้อมูลทั่วไป — fill ชื่อจริง and นามสกุล
- tapOn:
    text: "ชื่อจริง"
- inputText: "TestUser"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: "นามสกุล"
- inputText: "Maestro"
- waitForAnimationToEnd:
    timeout: 1000

# Tap next button to go to step 1
- tapOn:
    text: ".*ถัดไป.*"
- waitForAnimationToEnd:
    timeout: 3000

# Step 1: ข้อมูลเข้าสู่ระบบ — should show username and password fields
- extendedWaitUntil:
    visible: ".*ข้อมูลเข้าสู่ระบบ.*|.*ชื่อผู้ใช้.*"
    timeout: 10000

- assertVisible: ".*ชื่อผู้ใช้.*|.*รหัสผ่าน.*"
