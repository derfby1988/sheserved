# Scenario 12: Prescription Editor แสดง Effective Risk (Manual Test Guide)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# ⚠️ This scenario CANNOT be fully automated with Maestro because
#    PrescriptionEditorPage requires a consultation context (consultationId + patientId).
#    It can only be accessed via:
#    - ChatRoom → "เครื่องมือแพทย์" → "ออกใบสั่งยา (Prescription)"
#    - ChartBoard → _viewPrescriptionDetails (requires existing prescription)
#
#    This file documents the manual test steps. The automated portion
#    logs in and navigates as far as possible (to the home page).
#
# Prerequisites:
#   - Scenario 2 must have been run (Paracetamol has Org Override in clinic A)
#   - User must have an active consultation request to access Prescription Editor
#   - User "apisek" or "firm" must be a provider in clinic A
#
# Credentials:
#   - Provider: apisek / 123456 (or firm / 123456)
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 12
#   - lib/features/consultation/presentation/pages/prescription_editor_page.dart
#   - lib/features/chat/presentation/pages/chat_room_page.dart (_openPrescriptionEditor)
#   - lib/features/consultation/presentation/pages/chart_board_page.dart (_viewPrescriptionDetails)

appId: com.example.treeLawZoo
env:
  PROVIDER_USERNAME: "apisek"
  PROVIDER_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Automated Portion: Login (verify app is ready)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Verify login
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

# Close drawer
- tapOn:
    point: "370,400"
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# MANUAL TEST STEPS (cannot be automated)
# ═══════════════════════════════════════════
#
# Prerequisite: You need an active consultation request from a patient.
# If none exists, create one from a patient account first.
#
# Step 1: Open the consultation chat room (from Dashboard or consultation list)
#   - Go to Dashboard → find an active consultation → tap to open ChatRoom
#
# Step 2: Open Prescription Editor
#   - In ChatRoom, tap the "เครื่องมือแพทย์" button (medical tools icon)
#   - In the bottom sheet, tap "ออกใบสั่งยา (Prescription)"
#
# Step 3: Add medication with Organization Override (Paracetamol)
#   - In the medication autocomplete field, type "Paracetamol"
#   - Select Paracetamol from the dropdown (this stores medication_id)
#   - ✅ EXPECTED: Paracetamol shows Badge 🔵 (Organization scope)
#   - ✅ EXPECTED: FDA Risk Status reflects the Override value (not default)
#
# Step 4: Add medication without Override (e.g., Ibuprofen or any drug without override)
#   - Type a medication name that has NO Override
#   - ✅ EXPECTED: Shows Sheserved Default values (no Badge)
#
# Step 5: Trigger screening
#   - Tap "ตรวจสอบความเสี่ยง" or the screening button
#   - ✅ EXPECTED: Screening results use merged values (override > default)
#   - ✅ EXPECTED: Paracetamol shows the overridden risk level
#
# Step 6: Verify Badge display
#   - ✅ Paracetamol: Badge 🔵 (Organization Override)
#   - ✅ Drug without override: No Badge (Default)
#   - ✅ If a drug with Personal Override exists: Badge 🟣 (Personal Override)
