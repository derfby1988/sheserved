# Scenario 4: ผู้มีสิทธิ์คนที่ 2 แก้ Org Override ยา X และตรวจสอบ History
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# This flow logs in with a second clinic A user (firm, can_manage_drug_risk = true),
# searches for Paracetamol (which has Override set by apisek in Scenario 2),
# verifies the Last-Modified Banner shows apisek's name, edits the Override,
# then checks the History tab for 2 entries (create + update).
#
# Prerequisites:
#   - Scenario 2 must have been run first (apisek set Override for Paracetamol)
#   - User "firm" must have can_manage_drug_risk = true (same profession_id as apisek)
#
# Credentials:
#   - Second editor: firm / 123456
#
# Run:
#   maestro test docs/guides/scenario_04_second_editor_history.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 4
#   - lib/features/pharmacy/presentation/pages/drug_risk_classification_admin_page.dart
#     _buildCardBanner (line 250): "⚠️ แก้ไขล่าสุดโดย ${modifier.name}"
#     _buildHistoryTab (line 1151): "การกระทำ: สร้าง/แก้ไขการ Override"

appId: com.example.treeLawZoo
env:
  EDITOR_USERNAME: "firm"
  EDITOR_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
  FIRST_EDITOR_NAME: "Dave"
  SECOND_EDITOR_NAME: "อภิเษก"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and login as second editor (firm)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Verify login and navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 3: Search Paracetamol and verify Last-Modified Banner (apisek)
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Verify Override badge exists (set by apisek in Scenario 2)
- assertVisible: ".*Override องค์กร.*"

# Verify Last-Modified Banner shows first editor's name (full name, not username)
- extendedWaitUntil:
    visible: ".*แก้ไขล่าสุดโดย.*${FIRST_EDITOR_NAME}.*"
    timeout: 15000

# ═══════════════════════════════════════════
# Step 4: Edit Override — change FDA Risk Status
# ═══════════════════════════════════════════
- tapOn: ".*ตั้งค่า.*Override.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: 'Override:.*'

# Change FDA Risk Status to N (ยาเสพติดให้โทษ)
- tapOn:
    text: "FDA Risk Status.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "N (ยาเสพติดให้โทษ)"
- waitForAnimationToEnd:
    timeout: 2000

# Fill reason field
- tapOn:
    text: "เหตุผลการ Override เพื่อบันทึกประวัติ *"
- waitForAnimationToEnd:
    timeout: 1000
- setClipboard: "Second editor update override"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000

# Save
- tapOn: "บันทึก Override"
- waitForAnimationToEnd:
    timeout: 10000

# Wait for page to finish reloading after save (mutation loading overlay)
- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 5: Re-search and verify banner changed to second editor (firm)
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

# Wait for search results to appear
- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# Verify Override badge still present (use extendedWaitUntil for reliability)
- extendedWaitUntil:
    visible: ".*Override องค์กร.*"
    timeout: 60000

# Verify Last-Modified Banner now shows second editor's name (full name)
- extendedWaitUntil:
    visible: ".*แก้ไขล่าสุดโดย.*${SECOND_EDITOR_NAME}.*"
    timeout: 15000

# ═══════════════════════════════════════════
# Step 6: Go to History tab and verify 2 entries
# ═══════════════════════════════════════════
- tapOn: "ประวัติการตั้งค่า"
- waitForAnimationToEnd:
    timeout: 3000

# Verify history tab loaded
- assertVisible: ".*ประวัติการตั้งค่า.*"

# Verify create entry by first editor
- extendedWaitUntil:
    visible: ".*สร้างการ Override.*"
    timeout: 15000
- assertVisible: ".*${FIRST_EDITOR_NAME}.*"

# Verify update entry by second editor
- assertVisible: ".*แก้ไขการ Override.*"
- assertVisible: ".*${SECOND_EDITOR_NAME}.*"
