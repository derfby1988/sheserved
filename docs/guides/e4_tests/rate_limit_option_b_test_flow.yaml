- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- inputText: "${CONSUMER_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    below:
      text: "รหัสผ่าน"
- inputText: "${CONSUMER_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "ยินดีต้อนรับ!"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- extendedWaitUntil:
    visible:
      text: ".*เข้าสู่ระบบสำเร็จ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    point: "50,809"
- waitForAnimationToEnd:
    timeout: 3000

# D.2 พยายามเข้าสู่หน้าอัปโหลดวิดีโอ
- runFlow:
    when:
      visible: ".*วิดีโอ.*"
    commands:
      - tapOn: ".*วิดีโอ.*"
      - waitForAnimationToEnd:
          timeout: 5000

# D.3 ตรวจสอบว่าปุ่มอัปโหลดมีอยู่ (app ไม่ crash จากการแก้ไข multer config)
- runFlow:
    when:
      visible: ".*อัปโหลด.*"
    commands:
      - assertVisible: ".*อัปโหลด.*"

- clearState

---
