# Shared navigation subflow: Home -> ERP Dashboard -> Employees -> Invitations tab
# Precondition: User must be logged in and on Home page with ERP card visible
#               (requires active employee_roles in DB)
# Device: R8YYA0G5S6J (Android) — screen 800x1340
appId: com.sheserved.app
name: "E4 - Navigate to Invitations Tab"
tags:
  - e4-shared
---
# Press Home tab (bottom-left nav icon) to ensure we're on home page
- tapOn:
    point: "15%, 96%"
- waitForAnimationToEnd:
    timeout: 3000

# Scroll down to find the ERP Dashboard card
# Scroll from right side to avoid map area capturing the gesture
- scrollUntilVisible:
    element:
      text: ".*ERP.*"
    direction: DOWN
    timeout: 10000

# Tap the "เข้า" button on the ERP card
- tapOn: "เข้า"
- waitForAnimationToEnd:
    timeout: 5000

# Expand the mini sidebar by tapping the toggle button (top-left corner)
# Sidebar is 60px wide when collapsed; toggle is at ~3% width, ~3% height
- tapOn:
    point: "3%, 4%"
- waitForAnimationToEnd:
    timeout: 3000

# Tap "พนักงาน" in the expanded sidebar
- scrollUntilVisible:
    element:
      text: "พนักงาน"
    direction: DOWN
    timeout: 8000
- tapOn: "พนักงาน"
- waitForAnimationToEnd:
    timeout: 5000

# Switch to the "คำเชิญ" tab
- tapOn: "คำเชิญ"
- waitForAnimationToEnd:
    timeout: 3000
