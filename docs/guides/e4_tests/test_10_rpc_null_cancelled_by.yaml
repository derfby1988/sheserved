# E4.9 Test 10: เรียก cancel RPC โดยส่ง p_cancelled_by = NULL → RPC ต้อง reject
# Expected: RPC returns {success: false, error: 'ไม่พบผู้ใช้ใน session'}
# Note: นี่เป็น database-level test ไม่สามารถทดสอบผ่าน UI ได้โดยตรง
# ต้องรัน SQL ตรงๆ หรือใช้ Supabase client เพื่อทดสอบ
# Device: R8YYA0G5S6J (Android)
appId: com.sheserved.app
name: "E4 Test 10 - RPC rejects NULL cancelled_by"
tags:
  - e4
  - rpc
  - security
  - db-test
---
# This test verifies database-level security, not UI behavior.
# To run this test manually via Supabase SQL Editor:
#
#   SELECT public.cancel_employee_invitation(
#     p_token := 'some-pending-token',
#     p_cancelled_by := NULL,
#     p_cancellation_reason := NULL
#   );
#
# Expected result: {"success": false, "error": "ไม่พบผู้ใช้ใน session"}
#
# UI Verification (indirect):
# The Flutter app always sends AuthService.instance.currentUser?.id as p_cancelled_by.
# If the user is not logged in, the app will not show the cancel button.
# This test verifies that even if the UI is bypassed, the RPC still rejects NULL.

# Login as admin to verify the app works normally
- runFlow:
    file: "_login.yaml"
    env:
      USERNAME: "apisek"
      PASSWORD: "123456"

# Navigate to invitations to verify cancel button requires login
- runFlow: "_navigate_to_invitations.yaml"

# Verify the cancel (X) button is only visible for logged-in admin with HR >= 2
- assertVisible:
    text: ".*รอตอบรับ.*"
    label: "Verify pending invitations visible (admin is logged in)"
    optional: true

# Take screenshot documenting the test
- takeScreenshot: "test_10_rpc_null_check"

# Note: Full verification requires SQL:
# SELECT public.cancel_employee_invitation('token', NULL, NULL);
# Must return success=false with error message about missing session user
