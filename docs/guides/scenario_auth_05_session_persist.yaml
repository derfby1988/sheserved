# AUTH-05: Session persistence — ปิดแอปแล้วเปิดใหม่ (in-memory session หาย)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "sister" has password 123456
#
# Expected:
#   - After login, kill app and relaunch (without clearState)
#   - AuthService is in-memory only, so session is lost
#   - App shows guest mode (login icon visible, no logout button)
#
# Run:
#   maestro test docs/guides/scenario_auth_05_session_persist.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - auth
env:
  USERNAME: "sister"
  PASSWORD: "123456"
---
# Step 1: Login with clearState
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Kill the app
- killApp:
    appId: com.example.treeLawZoo

# Step 3: Relaunch WITHOUT clearState (preserve session)
- launchApp:
    appId: com.example.treeLawZoo
    clearState: false

# Step 4: Verify guest mode — home page loads with search bar (guest mode)
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000

# Step 5: Open drawer to verify guest state (should show "ลงชื่อเข้าใช้" not "ออกจากระบบ")
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

# Scroll to bottom of drawer to find auth button
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ลงชื่อเข้าใช้"
