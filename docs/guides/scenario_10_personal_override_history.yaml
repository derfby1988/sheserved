# Scenario 10: Independent user accesses Personal Override and History
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "independent" has password 123456
#   - The user is authenticated and users.profession_id IS NULL
#   - App is connected to the live Supabase backend
#
# Expected:
#   - Drawer shows "จัดการหมวดหมู่ความเสี่ยงยา"
#   - Drug Risk page opens in Personal mode
#   - Personal Override history is scoped to the current user
#
# Run:
#   maestro test docs/guides/scenario_10_personal_override_history.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
env:
  USERNAME: "independent"
  PASSWORD: "123456"
---
# Step 1: Launch app and login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- inputText: "${USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    below:
      text: "รหัสผ่าน"
- inputText: "${PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: ".*ยินดีต้อนรับ.*"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"

- extendedWaitUntil:
    visible: ".*ค้นหาการบริจาค.*"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Verify Drawer Gating now exposes Personal Override
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 75%"
    end: "50%, 25%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "จัดการหมวดหมู่ความเสี่ยงยา"
- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

# Step 3: Verify Personal mode and user-scoped history
- assertVisible: 'จัดการความเสี่ยงยา \(Personal\)'
- tapOn: "ประวัติการตั้งค่า.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: ".*ประวัติการตั้งค่า.*|.*ไม่มีประวัติการตั้งค่า Override.*"
