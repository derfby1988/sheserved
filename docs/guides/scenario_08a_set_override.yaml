# Scenario 8a: Doctor A (apisek) sets Override — Phase 1
# Device: Physical iPhone 14ProMax (00008120-000058A41A40C01E) — iOS 26.5
#
# This is Phase 1 of Scenario 8. After this completes:
#   1. MANUALLY set is_active = false for apisek in Supabase Dashboard
#   2. Run scenario_08b_verify_fallback.yaml
#
# Prerequisites:
#   - User "apisek" must have can_manage_drug_risk = true and is_active = true
#   - Paracetamol must NOT have an active Override (run Scenario 7 first to clear)
#
# Run:
#   maestro test docs/guides/scenario_08a_set_override.yaml --udid 00008120-000058A41A40C01E

appId: com.example.treeLawZoo
env:
  DOCTOR_A_USERNAME: "apisek"
  DOCTOR_A_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and login as Doctor A (apisek)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 3: Search Paracetamol and set Override
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Wait for enrichment to complete
- extendedWaitUntil:
    visible: ".*ตั้งค่า Override.*"
    timeout: 15000

# Dismiss keyboard
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 3000

# Tap Override on the first card that has the button
- tapOn:
    text: ".*ตั้งค่า.*Override.*"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: 'Override:.*'

# Set FDA = S
- tapOn:
    text: "FDA Risk Status.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: "S (ยาควบคุมพิเศษ)"
- waitForAnimationToEnd:
    timeout: 2000

# Scroll down to reveal reason field
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 1000

# Fill reason
- tapOn:
    text: ".*เหตุผลการ Override.*"
- waitForAnimationToEnd:
    timeout: 1000
- setClipboard: "Doctor A override for fallback test"
- pasteText
- waitForAnimationToEnd:
    timeout: 1000

- tapOn: "บันทึก Override"
- waitForAnimationToEnd:
    timeout: 10000

# ✅ Verify override was saved
- extendedWaitUntil:
    visible: ".*บันทึก Override สำเร็จ.*"
    timeout: 30000

# ═══════════════════════════════════════════
# Step 4: Kill app
# ═══════════════════════════════════════════
- killApp:
    appId: com.example.treeLawZoo

# ═══════════════════════════════════════════
# ⛔ MANUAL STEP REQUIRED NOW:
# 1. Open Supabase Dashboard → Table Editor → users
# 2. Find the row where username = 'apisek'
# 3. Set is_active = false
# 4. Then run scenario_08b_verify_fallback.yaml
# ═══════════════════════════════════════════
