# ============================================================
# Sport Club UI Test — Admin (calibrated on CPH1989, Android 11, 1080x2340)
# ============================================================
# วัตถุประสงค์: ตรวจหา overlay / การล้นจอ (RenderFlex overflow) บนหน้า
# Sport Club ทั้งหน้า feed, group card, group detail sheet, filter sheet
# และ create-group page โดยล็อกอินเป็น Admin ของ Sheserved
#
# หมายเหตุ:
# - drawer ต้องยุบโซน "บริการทางการแพทย์" ก่อนจึงจะเห็นเมนู
#   "หาเพื่อนออกกำลังกาย" (scroll ใน drawer ไม่เสถียรบนเครื่องนี้)
# - ตรวจ overflow ได้จาก logcat: grep "RenderFlex overflowed"
appId: com.sheserved.app
tags:
  - sport-club
  - ui
  - admin
---

# Step 1: Login as Admin of Sheserved
- runFlow:
    file: login_admin_CPH1989.yaml
- waitForAnimationToEnd:
    timeout: 5000

# Step 2: Enter Find Buddies using the shared drawer navigation flow
- runFlow:
    file: sport_club_entry_CPH1989.yaml

# Step 3: Assert main UI controls are present
- assertVisible: ".*ทั้งหมด.*"
- assertVisible: ".*สร้างก๊วน.*"
- waitForAnimationToEnd:
    timeout: 3000

# Step 4: Toggle quick filter "ยังเปิดรับ" on and off
- tapOn: ".*ยังเปิดรับ.*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ".*ยังเปิดรับ.*"
- waitForAnimationToEnd:
    timeout: 3000

# Step 5: Open first group card detail sheet
- tapOn:
    text: ".*แบดมินตัน.*"
    index: 0
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: sport_club_group_detail_admin.png
- back
- waitForAnimationToEnd:
    timeout: 4000

# Step 6: Open advanced filter sheet
- tapOn:
    text: "ค้นหา"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: sport_club_filter_admin.png
- back
- waitForAnimationToEnd:
    timeout: 4000

# Step 7: Open create-group page (FAB)
- tapOn: "สร้างก๊วน"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: sport_club_create_group_admin.png
- back
- waitForAnimationToEnd:
    timeout: 4000

# Step 8: Confirm still on sport club feed
- extendedWaitUntil:
    visible: ".*หาเพื่อนออกกำลังกาย.*"
    timeout: 20000
