# CONS-02: แท็บ "กำลังดำเนินการ" แสดง in_progress consultations
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" has password 123456, is_provider=true
#   - At least one in_progress consultation exists for this provider
#
# Expected:
#   - Dashboard loads, "กำลังดำเนินการ" tab is selected
#   - At least one consultation entry with "เข้าห้องแชทผู้ป่วย" button is visible
#
# Run:
#   maestro test docs/guides/scenario_cons_02_in_progress.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - consultation
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to dashboard
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000

# Step 3: Tap "กำลังดำเนินการ" tab
- tapOn: "กำลังดำเนินการ"
- waitForAnimationToEnd:
    timeout: 3000

# Step 4: Verify at least one consultation entry exists
- extendedWaitUntil:
    visible:
      text: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000
