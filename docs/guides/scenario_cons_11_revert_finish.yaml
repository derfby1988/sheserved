# CONS-11: ยกเลิกการจบการรักษา (revert finish)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" has password 123456, is_provider=true
#   - At least one finished consultation exists that can be reverted
#
# Expected:
#   - Navigate to finished tab
#   - Open a finished consultation
#   - Tap revert/cancel finish button
#   - Consultation returns to in_progress
#
# Note: This test depends on the revert UI being available on ChartBoardPage
#   for finished consultations. Adjust based on actual UI.
#
# Run:
#   maestro test docs/guides/scenario_cons_11_revert_finish.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - consultation
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to dashboard → finished tab
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000

- tapOn: "เสร็จสิ้น"
- waitForAnimationToEnd:
    timeout: 3000

# Step 3: Open a finished consultation
- extendedWaitUntil:
    visible:
      text: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000

- tapOn: ".*เข้าห้องแชทผู้ป่วย.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      text: ".*ถามผู้เชี่ยวชาญ.*|.*ส่ง.*|.*แชท.*|.*จบการรักษา.*"
    timeout: 30000

# Step 4: Look for revert button
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# Tap revert/cancel finish
- tapOn:
    text: ".*ยกเลิกการจบ.*|.*เปิดใหม่.*|.*กลับไปดำเนินการ.*|.*revert.*"
- waitForAnimationToEnd:
    timeout: 3000

# Confirm if dialog appears
- extendedWaitUntil:
    visible:
      text: ".*ยืนยัน.*|.*ตกลง.*"
    timeout: 5000

- tapOn:
    text: ".*ยืนยัน.*|.*ตกลง.*"
- waitForAnimationToEnd:
    timeout: 5000

# Verify consultation reverted to in_progress
- extendedWaitUntil:
    visible:
      text: ".*จบการรักษา.*|.*กำลังดำเนินการ.*"
    timeout: 15000
