# หลังล็อกอิน แอปไปที่แดชบอร์ดคำร้อง — ผู้ใช้ทั่วไปต้องไม่เห็นปุ่มรับงาน
- runFlow:
    when:
      visible: ".*รับงาน.*"
    commands:
      - assertTrue: false
- runFlow:
    when:
      notVisible: ".*รับงาน.*"
    commands:
      - assertVisible: ".*คำร้อง.*"
- clearState
