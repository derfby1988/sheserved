- tapOn: "ยินดีต้อนรับ!"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- extendedWaitUntil:
    visible:
      text: ".*เข้าสู่ระบบสำเร็จ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    point: "50,809"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: ".*ปรึกษาแพทย์.*"
    commands:
      - tapOn: ".*ปรึกษาแพทย์.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*ข้อความ.*"
          timeout: 15000
- runFlow:
    when:
      visible: "${TEST_MESSAGE}"
    commands:
      - assertVisible: "${TEST_MESSAGE}"

- clearState

