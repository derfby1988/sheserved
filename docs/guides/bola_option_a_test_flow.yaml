# ส่วน C: แชท — ตรวจสอบสิทธิ์ผู้เข้าร่วม (callerId ในทุกเมธอด)
# C.1 ผู้ให้บริการเปิดแชทการปรึกษาและส่งข้อความ
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
