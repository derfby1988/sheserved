    timeout: 1000
- tapOn:
    below:
      text: "รหัสผ่าน"
- inputText: "${PROVIDER_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "ยินดีต้อนรับ!"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- extendedWaitUntil:
    visible:
      text: ".*เข้าสู่ระบบสำเร็จ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
