# แผนทดสอบ BOLA ตัวเลือก A: Layered Authorization Boundary — ผลกระทบจากการแก้ไข
# อุปกรณ์: iPhone 16 (822794E6-EF5C-420A-8620-0BB8653C60E3)
# วิธีรัน: maestro test --device 822794E6-EF5C-420A-8620-0BB8653C60E3 docs/guides/bola_option_a_test_flow.yaml
# ครอบคลุม: A=ทดสอบล็อกอิน, B=การปรึกษา, C=แชท, D=ข้อมูลสุขภาพ, E=วิดีโอ, F=เชิงลบ

appId: com.example.treeLawZoo

env:
  CONSUMER_USERNAME: "firm"
  CONSUMER_PASSWORD: "123456"
  PROVIDER_USERNAME: "apisek"
  PROVIDER_PASSWORD: "123456"
  ADMIN_USERNAME: "derfby"
  ADMIN_PASSWORD: "123456"
  TEST_MESSAGE: "BOLA test message"

---
# ส่วน A: ทดสอบล็อกอิน (ตรวจสอบว่าการแก้ไข verifyToken ไม่ทำลายระบบล็อกอิน)
# A.1 ล็อกอินด้วยบัญชีผู้ใช้ทั่วไป (Consumer)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- inputText: "${CONSUMER_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    below:
      text: "รหัสผ่าน"
- inputText: "${CONSUMER_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "ยินดีต้อนรับ!"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- extendedWaitUntil:
    visible:
      text: ".*เข้าสู่ระบบสำเร็จ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    point: "50,809"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 60000
- clearState

