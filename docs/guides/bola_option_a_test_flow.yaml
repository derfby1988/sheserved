      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: ".*คำร้อง.*"
    timeout: 15000
- runFlow:
    when:
      visible: ".*in_progress.*"
    commands:
      - tapOn: ".*in_progress.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*ข้อความ.*"
          timeout: 15000

- runFlow:
    when:
      visible: ".*ส่งข้อความ.*"
    commands:
      - tapOn: ".*ส่งข้อความ.*"
      - inputText: "${TEST_MESSAGE}"
      - tapOn: ".*ส่ง.*"
      - waitForAnimationToEnd:
          timeout: 3000

- runFlow:
    when:
      visible: "${TEST_MESSAGE}"
    commands:
      - assertVisible: "${TEST_MESSAGE}"

- clearState

# C.2 ผู้ใช้ทั่วไปเห็นข้อความของผู้ให้บริการในการปรึกษาเดียวกัน
