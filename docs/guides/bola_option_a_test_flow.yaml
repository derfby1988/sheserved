    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- inputText: "${CONSUMER_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    below:
      text: "รหัสผ่าน"
- inputText: "${CONSUMER_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "ยินดีต้อนรับ!"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- extendedWaitUntil:
    visible:
      text: ".*เข้าสู่ระบบสำเร็จ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
# หลังล็อกอิน แอปจะไปที่แดชบอร์ดคำร้อง
- extendedWaitUntil:
    visible: ".*คำร้อง.*"
    timeout: 15000
- clearState

