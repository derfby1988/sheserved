# GUARD-01: Route guard — ไม่ login เข้า /erp/dashboard → redirect
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - App is in guest mode (not logged in)
#   - ERP dashboard route requires authentication
#
# Expected:
#   - App launches in guest mode
#   - Attempting to access ERP route without login redirects to home or login
#   - ERP dashboard content is NOT visible
#
# Run:
#   maestro test docs/guides/scenario_guard_01_erp_no_auth.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - security
  - guard
---
# Step 1: Launch app in guest mode (clearState ensures no session)
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Step 2: Verify we are on home page (guest mode)
- assertVisible: "ค้นหายา ร้านยา หมอ..."

# Step 3: Open drawer
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

# Step 4: ERP menu should NOT be visible in guest mode
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# Assert ERP Dashboard menu item is not visible
- assertNotVisible: ".*ERP.*|.*แดชบอร์ด ERP.*"
