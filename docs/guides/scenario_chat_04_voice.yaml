# CHAT-04: ส่งไฟล์เสียง (voice message) ใน ChartBoardPage
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" has password 123456, is_provider=true
#   - At least one in_progress consultation exists
#   - Microphone permission is granted
#
# Expected:
#   - Enter ChartBoardPage
#   - Tap and hold the microphone/voice button
#   - Release to send voice message
#   - Voice message appears in chat
#
# Note: Voice recording on simulator may not work without microphone input.
#   This test verifies the UI flow only.
#
# Run:
#   maestro test docs/guides/scenario_chat_04_voice.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - chat
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to ChartBoardPage
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000

- tapOn: "กำลังดำเนินการ"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      text: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000

- tapOn: ".*เข้าห้องแชทผู้ป่วย.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      text: ".*ถามผู้เชี่ยวชาญ.*|.*ส่ง.*"
    timeout: 30000

# Step 3: Look for microphone/voice button
# This is typically a mic icon near the chat input
- tapOn:
    text: ".*ไมโครโฟน.*|.*บันทึกเสียง.*|.*mic.*|.*เสียง.*"
- waitForAnimationToEnd:
    timeout: 3000

# Note: Voice recording UI should appear.
# On simulator, verify recording UI is shown.
- extendedWaitUntil:
    visible:
      text: ".*บันทึก.*|.*กำลังบันทึก.*|.*หยุด.*|.*ส่ง.*"
    timeout: 5000
