# AUTH-07: Register simple — สร้างบัญชีเร่งด่วน
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - App is connected to live Supabase backend
#
# Expected:
#   - Navigate to register page
#   - Verify register form is visible with required fields
#   - Verify "ลงทะเบียน" link works from login page
#
# Run:
#   maestro test docs/guides/scenario_auth_07_register_simple.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - registration
  - auth
---
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Navigate to login page
- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

# Verify "ลงทะเบียน" link is visible
- assertVisible: "ลงทะเบียน"

# Tap register link
- tapOn: "ลงทะเบียน"
- waitForAnimationToEnd:
    timeout: 3000

# Verify register wizard page loaded — step 0 title
- extendedWaitUntil:
    visible: ".*ข้อมูลทั่วไป.*|.*ลงทะเบียน.*"
    timeout: 15000

# Verify key form elements exist (step 0: ชื่อจริง, นามสกุล)
- assertVisible: "ชื่อจริง"
- assertVisible: "นามสกุล"
