# HOME-02: Home page แสดง donation cards / featured content
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - App is in guest mode
#   - Supabase backend has donation data
#
# Expected:
#   - Home page shows donation-related content after scrolling
#   - "ค้นหาการบริจาค" text or donation cards are visible
#
# Run:
#   maestro test docs/guides/scenario_home_02_donation_cards.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - home
---
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Scroll down to see content below the search bar
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# Verify some content is displayed (article section or search bar)
- extendedWaitUntil:
    visible:
      text: ".*แนะนำโดยผู้เชี่ยวชาญ.*|.*ค้นหายา ร้านยา หมอ.*|.*บทความ.*"
    timeout: 15000
