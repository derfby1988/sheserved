# Scenario 7: กด "คืนค่า Default" (ลบ Override) และตรวจสอบ History
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# This flow logs in as apisek, searches for Paracetamol (which has Override from
# Scenario 2/4/6), opens the Override dialog, taps "คืนค่า Default", confirms
# deletion, then verifies:
#   1. SnackBar "คืนค่า Default สำเร็จ" appears
#   2. Card no longer shows Override badge
#   3. History tab shows a "ยกเลิกการ Override (คืนค่า)" entry
#
# ⚠️ This test DELETES the Override. Run Scenario 2 again after this test
#    if you need the Override to exist for subsequent tests.
#
# Prerequisites:
#   - Paracetamol must have an active Organization Override (from Scenario 2/4/6)
#   - User "apisek" must have can_manage_drug_risk = true
#
# Credentials:
#   - Admin: apisek / 123456
#
# Run:
#   maestro test docs/guides/scenario_07_remove_override.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 7
#   - lib/features/pharmacy/presentation/pages/drug_risk_classification_admin_page.dart
#     _removeOverride (line 1672): confirmation dialog → removeOverride → SnackBar
#     _buildHistoryTab (line 1196): "ยกเลิกการ Override (คืนค่า)"

appId: com.example.treeLawZoo
env:
  ADMIN_USERNAME: "apisek"
  ADMIN_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and login as admin (apisek)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${ADMIN_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    below:
      text: "รหัสผ่าน"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${ADMIN_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: ".*ยินดีต้อนรับ.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"

- extendedWaitUntil:
    visible:
      text: ".*ค้นหาการบริจาค.*"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 3: Search Paracetamol and verify Override exists
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Verify Override badge exists before removal (indicates enrichment is done)
- extendedWaitUntil:
    visible: ".*Override องค์กร.*"
    timeout: 15000

# Dismiss keyboard using the Done button on the keyboard
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 4: Scroll to find the card with "คืนค่า Default" button
# ═══════════════════════════════════════════
# Search for "Paracetamol" returns multiple results.
# The first card may not have an override; the one with "คืนค่า Default" is below.
- scrollUntilVisible:
    element: ".*คืนค่า Default.*"
    direction: DOWN
    timeout: 15000
    speed: 50

- tapOn: ".*คืนค่า Default.*"
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 5: Confirm deletion in dialog
# ═══════════════════════════════════════════
- assertVisible: "ยืนยันการคืนค่าเริ่มต้น"
- assertVisible: ".*คุณต้องการลบการ Override ยานี้.*"

- tapOn: "ยืนยันการคืนค่า"
- waitForAnimationToEnd:
    timeout: 3000

# ✅ Verify success SnackBar (wait longer since search+reload takes time before SnackBar shows)
- extendedWaitUntil:
    visible: ".*คืนค่า Default สำเร็จ.*"
    timeout: 30000

# ═══════════════════════════════════════════
# Step 6: Re-search and verify the deleted override is gone
# ═══════════════════════════════════════════
# Note: Other Paracetamol variants may still have their own overrides,
# so we cannot assert "no Override badge at all". Instead, we verify
# that no "คืนค่า Default" button exists for the specific card we deleted
# (BOOTS PARACETAMOL, Generic: โอสถ อินเตอร์ แลบบอราทอรีส์).
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500
- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Wait for enrichment to complete
- extendedWaitUntil:
    visible: ".*ตั้งค่า Override.*"
    timeout: 15000

# Dismiss keyboard
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 3000

# ✅ Verify the deleted card no longer has "คืนค่า Default" button
# The card (BOOTS PARACETAMOL, Generic: โอสถ อินเตอร์) should now only show
# "ตั้งค่า Override" without "คืนค่า Default" since activeOverride is null.
# We check that the number of "คืนค่า Default" buttons decreased.
# Since BOOTS PARACETAMOL CAPLETS may still have an override, we verify
# the specific card's banner is gone by checking the Last-Modified banner
# for "โอสถ อินเตอร์" is no longer visible.
- assertNotVisible: ".*โอสถ อินเตอร์.*แก้ไขล่าสุด.*"
- assertNotVisible: ".*แก้ไขล่าสุด.*โอสถ อินเตอร์.*"

# ═══════════════════════════════════════════
# Step 7: Go to History tab and verify delete entry
# ═══════════════════════════════════════════
- tapOn:
    text: ".*ประวัติการตั้งค่า.*"
- waitForAnimationToEnd:
    timeout: 3000

# Verify history tab loaded
- assertVisible: ".*ประวัติการตั้งค่า.*"

# ✅ Verify delete action in history
- assertVisible: ".*ยกเลิกการ Override.*"
- assertVisible: ".*Dave.*"
