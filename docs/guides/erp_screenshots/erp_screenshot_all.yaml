# ERP Screenshot Capture Flow — All ERP Pages
# Device: iPhone 17 Simulator (iOS) — BDFD0CA3-CEC2-435B-B707-097EA1FDFE44
# Login: apisek / 123456
# Purpose: Capture screenshots of every ERP page for UI review
appId: com.example.treeLawZoo
name: "ERP Screenshot All Pages"
tags:
  - erp-screenshot
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Section 1: Login — use Profile tab to check login status and login if needed
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
# Navigate to Profile tab to check login status
- tapOn:
    point: "87%, 95%"
- waitForAnimationToEnd:
    timeout: 3000
# If login button is visible, user is not logged in — perform login
- runFlow:
    when:
      visible: "เข้าสู่ระบบ / สมัครสมาชิก"
    commands:
      - tapOn: "เข้าสู่ระบบ / สมัครสมาชิก"
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
      - inputText: "${USERNAME}"
      - waitForAnimationToEnd:
          timeout: 1000
      - tapOn:
          below:
            text: "รหัสผ่าน"
      - inputText: "${PASSWORD}"
      - waitForAnimationToEnd:
          timeout: 1000
      # Dismiss keyboard by tapping "done" key
      - tapOn:
          point: "87%, 94%"
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: "เข้าสู่ระบบ"
      - waitForAnimationToEnd:
          timeout: 10000
      # Dismiss BackgroundPermissionDialog if present
      - runFlow:
          when:
            visible: "ไว้ทีหลัง"
          commands:
            - tapOn: "ไว้ทีหลัง"
            - waitForAnimationToEnd:
                timeout: 3000
      # Navigate to Home tab
      - tapOn:
          point: "12%, 95%"
      - waitForAnimationToEnd:
          timeout: 5000
# If already logged in, go to Home tab
- runFlow:
    when:
      notVisible: "เข้าสู่ระบบ / สมัครสมาชิก"
    commands:
      - tapOn:
          point: "12%, 95%"
      - waitForAnimationToEnd:
          timeout: 5000
# Navigate to ERP Dashboard from Home page
- scrollUntilVisible:
    element:
      text: ".*ERP.*"
    direction: DOWN
    timeout: 15000
- tapOn: "เข้า"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "erp_01_dashboard"
- waitForAnimationToEnd:
    timeout: 2000
