# AUTH-01: Login ด้วย username + password สำเร็จ (provider)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "sister" has password 123456, is_active=true, role=provider
#   - App is connected to live Supabase backend
#
# Expected:
#   - Login succeeds, SnackBar shows "เข้าสู่ระบบสำเร็จ"
#   - App navigates to Home page showing "ค้นหาการบริจาค"
#
# Run:
#   maestro test docs/guides/scenario_auth_01_login_username.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - auth
env:
  USERNAME: "sister"
  PASSWORD: "123456"
---
# Step 1: Launch app (clean state)
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Step 2: Tap the login icon on home screen
- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000
