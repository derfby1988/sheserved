# CHAT-03: ส่งรูปภาพใน ChartBoardPage
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" has password 123456, is_provider=true
#   - At least one in_progress consultation exists
#   - Photo library has at least one image on the simulator
#
# Expected:
#   - Enter ChartBoardPage
#   - Tap attachment/image button
#   - Select an image from photo library
#   - Image is sent and appears in chat
#
# Note: Image picker behavior may vary on simulator. Adjust steps as needed.
#
# Run:
#   maestro test docs/guides/scenario_chat_03_send_image.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - chat
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to ChartBoardPage
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000

- tapOn: "กำลังดำเนินการ"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      text: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000

- tapOn: ".*เข้าห้องแชทผู้ป่วย.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      text: ".*ถามผู้เชี่ยวชาญ.*|.*ส่ง.*"
    timeout: 30000

# Step 3: Tap attachment/image icon (typically a + or image icon near input)
- tapOn:
    text: ".*แนบ.*|.*รูป.*|.*ภาพ.*|.*attach.*"
- waitForAnimationToEnd:
    timeout: 3000

# Note: After tapping, the image picker should open.
# On simulator, this may show photo library.
# Tap the first available image.
- extendedWaitUntil:
    visible:
      text: ".*เลือก.*|.*Photo.*|.*รูปภาพ.*|.*คลังภาพ.*"
    timeout: 10000

# Select first photo (this step may need adjustment based on UI)
- tapOn:
    point: "100,200"
- waitForAnimationToEnd:
    timeout: 3000

# If a confirm/send button appears after selecting image, tap it
- extendedWaitUntil:
    visible:
      text: ".*ส่ง.*|.*ตกลง.*|.*ยืนยัน.*"
    timeout: 5000

- tapOn:
    text: ".*ส่ง.*|.*ตกลง.*|.*ยืนยัน.*"
- waitForAnimationToEnd:
    timeout: 5000
