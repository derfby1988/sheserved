# CONS-07: ออกใบสั่งยา → PrescriptionEditorPage
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" has password 123456, is_provider=true
#   - At least one in_progress consultation exists
#
# Expected:
#   - Navigate to ChartBoardPage → medical tools → ออกใบสั่งยา
#   - PrescriptionEditorPage opens with medication input fields
#
# Run:
#   maestro test docs/guides/scenario_cons_07_prescription_editor.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - consultation
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Navigate to ChartBoardPage
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000

- tapOn: "กำลังดำเนินการ"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      text: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000

- tapOn: ".*เข้าห้องแชทผู้ป่วย.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      text: ".*ถามผู้เชี่ยวชาญ.*|.*ส่ง.*|.*แชท.*"
    timeout: 30000

# Step 3: Open medical tools → Prescription Editor
- tapOn: "เครื่องมือแพทย์"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible:
      text: ".*ออกใบสั่งยา.*"
    timeout: 10000

- tapOn: ".*ออกใบสั่งยา.*"
- waitForAnimationToEnd:
    timeout: 5000

# Step 4: Verify PrescriptionEditorPage loaded
- extendedWaitUntil:
    visible:
      text: ".*ออกใบสั่งยา.*|.*ชื่อยา.*|.*ค้นหายา.*"
    timeout: 15000
