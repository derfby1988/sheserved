# แผนทดสอบ Path Traversal & Command Injection ตัวเลือก A: Safe Path Helper + Containment Check
# อุปกรณ์: SM X135G (R8YYA0G5S6J) — Android 16 (800x1340)
# วิธีรัน: maestro test --device R8YYA0G5S6J docs/guides/path_traversal_android_test_flow.yaml
# ครอบคลุม: A=ล็อกอิน smoke test, B=อัปโหลดภาพ regression, C=อัปโหลดวิดีโอ regression,
#           D=Admin watermark regression, E=เชิงลบ (path traversal/shell/null bytes), F=Regression
# Login pattern: ใช้รูปแบบเดียวกับ bola_negative_test_flow.yaml
#   - ไม่ใช้ clearState: true (ทำให้ ANR บนอุปกรณ์นี้)
#   - เข้าหน้า login ผ่าน drawer → ลงชื่อเข้าใช้ → ปิด drawer
#   - ใช้ pressKey: Back เพื่อปิด keyboard หลัง inputText
#   - รอ "ค้นหายา ร้านยา หมอ..." แทน "เข้าสู่ระบบสำเร็จ"
# เชื่อมโยง: docs/secure/02_path_traversal_command_injection.md (Option A)

appId: com.sheserved.app

env:
  CONSUMER_USERNAME: "firm"
  CONSUMER_PASSWORD: "123456"
  PROVIDER_USERNAME: "apisek"
  PROVIDER_PASSWORD: "123456"
  ADMIN_USERNAME: "derfby"
  ADMIN_PASSWORD: "123456"

---
# ส่วน A: ทดสอบล็อกอิน (ตรวจสอบว่าการแก้ไข safe-path ไม่ทำลายระบบล็อกอิน)
# A.1 ล็อกอินด้วยบัญชีผู้ใช้ทั่วไป (Consumer)
- launchApp:
    appId: com.sheserved.app
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "ลงชื่อเข้าใช้"
    timeout: 5000
- tapOn:
    point: "375,91"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "ยินดีต้อนรับ!"
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_USERNAME}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_PASSWORD}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "ยกเลิก"
    commands:
      - tapOn: "ยกเลิก"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "ค้นหายา ร้านยา หมอ..."

