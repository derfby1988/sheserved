# GUARD-04: Route guard — admin เข้า ERP ได้ และเห็นเมนู Admin
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Prerequisites:
#   - User "apisek" is admin with full access
#
# Expected:
#   - Login as admin succeeds
#   - Admin menu items ARE visible in drawer
#   - ERP menu IS visible in drawer
#
# Run:
#   maestro test docs/guides/scenario_guard_04_admin_access.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
tags:
  - smoke
  - security
  - guard
  - admin
env:
  USERNAME: "apisek"
  PASSWORD: "123456"
---
# Step 1: Login as admin
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# Step 2: Open drawer
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

# Step 3: Scroll through drawer — admin items SHOULD be visible
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# Verify admin section is visible in drawer
- assertVisible: "ผู้ดูแลระบบ"
