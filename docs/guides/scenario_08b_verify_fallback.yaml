# Scenario 8b: Doctor B (firm) verifies fallback_history banner — Phase 3
# Device: Physical iPhone 14ProMax (00008120-000058A41A40C01E) — iOS 26.5
#
# This is Phase 3 of Scenario 8. Run AFTER:
#   1. scenario_08a_set_override.yaml completed
#   2. MANUALLY set is_active = false for apisek in Supabase Dashboard
#
# Expected banner text:
#   "⚠️ ตั้งค่าโดยอดีตเจ้าหน้าที่ (โอนย้ายสิทธิ์ดูแลให้ ... [Active]...)"
#
# Prerequisites:
#   - User "firm" must have can_manage_drug_risk = true (same profession_id as apisek)
#   - apisek must have is_active = false
#   - Paracetamol must have an active Override set by apisek (from Phase 1)
#
# Run:
#   maestro test docs/guides/scenario_08b_verify_fallback.yaml --udid 00008120-000058A41A40C01E

appId: com.example.treeLawZoo
env:
  DOCTOR_B_USERNAME: "firm"
  DOCTOR_B_PASSWORD: "123456"
  MEDICATION_NAME: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 5: Launch app and login as Doctor B (firm)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- tapOn:
    point: "174,809"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ยินดีต้อนรับ.*"
    timeout: 10000

- assertVisible: "ชื่อผู้ใช้ / เบอร์โทรศัพท์"

- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${DOCTOR_B_USERNAME}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    below:
      text: "รหัสผ่าน"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${DOCTOR_B_PASSWORD}"
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: ".*ยินดีต้อนรับ.*"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "เข้าสู่ระบบ"

- extendedWaitUntil:
    visible:
      text: ".*ค้นหาการบริจาค.*"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 6: Navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 7: Search Paracetamol and verify fallback_history banner
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Wait for enrichment to complete
- extendedWaitUntil:
    visible: ".*ตั้งค่า Override.*"
    timeout: 15000

# Dismiss keyboard
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 3000

# ✅ Verify Override badge still present (override persists)
- scrollUntilVisible:
    element: ".*Override องค์กร.*"
    direction: DOWN
    timeout: 15000
    speed: 50
- assertVisible: ".*Override องค์กร.*"

# ✅ Verify fallback_history banner: "ตั้งค่าโดยอดีตเจ้าหน้าที่"
- extendedWaitUntil:
    visible: ".*ตั้งค่าโดยอดีตเจ้าหน้าที่.*"
    timeout: 15000
- assertVisible: ".*ตั้งค่าโดยอดีตเจ้าหน้าที่.*"

# ═══════════════════════════════════════════
# POST-TEST CLEANUP (Manual)
# ═══════════════════════════════════════════
# ⛔ After test: Set is_active = true for apisek in Supabase Dashboard
