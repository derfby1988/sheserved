# แผนทดสอบ Rate Limiting Option B: Input Bounds Enforcement — ผลกระทบจากการแก้ไข
# อุปกรณ์: SM X135G (R8YYA0G5S6J) — Android 16 (800x1340)
# วิธีรัน: maestro test --device R8YYA0G5S6J docs/guides/rate_limit_android_test_flow.yaml
# ครอบคลุม: A=ล็อกอิน smoke test, B=Emergency list pagination, C=Gallery pagination,
#           D=Video upload check, E=เชิงลบ (cache key sanitize regression)
# Login pattern: ใช้รูปแบบเดียวกับ bola_negative_test_flow.yaml
#   - ไม่ใช้ clearState: true (ทำให้ ANR บนอุปกรณ์นี้)
#   - เข้าหน้า login ผ่าน drawer → ลงชื่อเข้าใช้ → ปิด drawer
#   - ใช้ pressKey: Back เพื่อปิด keyboard หลัง inputText
#   - รอ "ค้นหายา ร้านยา หมอ..." แทน "เข้าสู่ระบบสำเร็จ"
# เชื่อมโยง: docs/secure/03_rate_limiting_resource_exhaustion.md (R1-R4)

appId: com.sheserved.app

env:
  CONSUMER_USERNAME: "firm"
  CONSUMER_PASSWORD: "123456"
  PROVIDER_USERNAME: "apisek"
  PROVIDER_PASSWORD: "123456"

---
# ส่วน A: Smoke test ล็อกอิน — ตรวจสอบว่าการแก้ไขใน video.js ไม่ทำลายระบบล็อกอิน
# A.1 ล็อกอินด้วยบัญชีผู้ใช้ทั่วไป (Consumer)
- launchApp:
    appId: com.sheserved.app
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "ลงชื่อเข้าใช้"
    timeout: 5000
- tapOn:
    point: "375,91"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "ยินดีต้อนรับ!"
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_USERNAME}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_PASSWORD}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "ยกเลิก"
    commands:
      - tapOn: "ยกเลิก"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "ค้นหายา ร้านยา หมอ..."
- clearState

# ส่วน B: Emergency Video List — ตรวจสอบ R2 (pagination clamp) + R4 (cache key)
# B.1 ล็อกอินและเข้าสู่หน้าวิดีโอเหตุฉุกเฉิน
- launchApp:
    appId: com.sheserved.app
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000
- tapOn:
    point: "51,88"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "ลงชื่อเข้าใช้"
    timeout: 5000
- tapOn:
    point: "375,91"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "ยินดีต้อนรับ!"
- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_USERNAME}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_PASSWORD}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "ยกเลิก"
    commands:
      - tapOn: "ยกเลิก"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 5000

# B.2 เข้าสู่แท็บวิดีโอเหตุฉุกเฉิน
- runFlow:
    when:
      visible: ".*วิดีโอ.*"
    commands:
      - tapOn: ".*วิดีโอ.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*เหตุฉุกเฉิน.*"
          timeout: 15000

# B.3 ตรวจสอบว่ารายการวิดีโอแสดงผล (pagination clamp ไม่ทำให้ app crash)
- runFlow:
    when:
      visible: ".*เหตุฉุกเฉิน.*"
    commands:
      - tapOn: ".*เหตุฉุกเฉิน.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible:
            text: ".*"
          timeout: 15000

# B.4 Scroll ลงเพื่อ trigger pagination หน้าถัดไป (page=2)
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 3000

# B.5 ตรวจสอบว่า app ไม่ crash หลัง scroll (R2 clamp ทำงาน)
- assertVisible:
    text: ".*"
- clearState

# ส่วน C: Gallery — ตรวจสอบ R2 (pagination clamp) + R4 (cache key sanitize)
# C.1 ล็อกอินและเข้าสู่หน้าวิดีโอ
