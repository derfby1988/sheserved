- waitForAnimationToEnd:
    timeout: 5000

# C.2 เข้าสู่แท็บวิดีโอและเปิด gallery ของวิดีโอใดวิดีโอหนึ่ง
- runFlow:
    when:
      visible: ".*วิดีโอ.*"
    commands:
      - tapOn: ".*วิดีโอ.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*เหตุฉุกเฉิน.*"
          timeout: 15000
      - tapOn: ".*เหตุฉุกเฉิน.*"
      - waitForAnimationToEnd:
          timeout: 5000

# C.3 ถ้ามีวิดีโอ ให้ tap เพื่อเปิด gallery
- runFlow:
    when:
      visible: ".*ดูรูป.*"
    commands:
      - tapOn: ".*ดูรูป.*"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: ".*"
          timeout: 15000
      - swipe:
          direction: DOWN
      - waitForAnimationToEnd:
          timeout: 3000
      - assertVisible:
          text: ".*"

- clearState

