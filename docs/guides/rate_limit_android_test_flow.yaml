- tapOn:
    text: "กรอกชื่อผู้ใช้หรือเบอร์โทร"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_USERNAME}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "400,914"
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "${CONSUMER_PASSWORD}"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "เข้าสู่ระบบ"
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "ยกเลิก"
    commands:
      - tapOn: "ยกเลิก"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "ไว้ทีหลัง"
    commands:
      - tapOn: "ไว้ทีหลัง"
      - waitForAnimationToEnd:
