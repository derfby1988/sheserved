# Scenario 9: ทุกคนในประวัติพ้นสภาพ (fallback_system)
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# ⚠️ This test requires MANUAL Supabase intervention.
#    All users who set the Override must be set to is_active = false
#    AND can_manage_drug_risk = false (or profession_id = null) in Supabase.
#
# Expected banner text (code line 258):
#   "⚠️ ดูแลโดย System Admin (เนื่องจากผู้ตั้งค่าพ้นสภาพการเป็นผู้ดูแลระบบ)"
#
# Prerequisites:
#   - Medication "0.0001% DPCP" (id: 81c3e60f) must have an active Org Override
#     set by apisek (last_modified_by = apisek)
#   - History for this medication must ONLY contain apisek's entries
#   - User "apisek" must have is_active = false (set manually)
#   - User "firm" must have can_manage_drug_risk = true and is_active = true
#
# Manual Supabase Setup (before running this test):
#   1. In Supabase → users table: set is_active = false for apisek
#   2. Ensure firm's profession still has can_manage_drug_risk = true
#   3. Verify override on DPCP (81c3e60f) exists with last_modified_by = apisek
#
# Credentials:
#   - Viewer: firm / 123456
#
# Run:
#   maestro test docs/guides/scenario_09_fallback_system.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 9
#   - lib/features/pharmacy/presentation/pages/drug_risk_classification_admin_page.dart
#     _buildCardBanner (line 257-260): fallback_system banner

appId: com.example.treeLawZoo
env:
  VIEWER_USERNAME: "firm"
  VIEWER_PASSWORD: "123456"
  MEDICATION_NAME: "DPCP"
---
# ═══════════════════════════════════════════
# PRE-TEST MANUAL STEPS
# ═══════════════════════════════════════════
# ⛔ MANUAL STEP REQUIRED before running this test:
# 1. In Supabase → users: set is_active = false for apisek
# 2. Ensure firm can still access Drug Risk Admin (can_manage_drug_risk = true)

# ═══════════════════════════════════════════
# Step 1: Launch app and login as viewer (firm)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Navigate to Drug Risk Admin
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- assertVisible: "ออกจากระบบ"

- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "จัดการหมวดหมู่ความเสี่ยงยา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ค้นหายา.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 3: Search DPCP and verify fallback_system banner
# ═══════════════════════════════════════════
- tapOn:
    point: "150,287"
- waitForAnimationToEnd:
    timeout: 1000
- eraseText
- waitForAnimationToEnd:
    timeout: 500

- inputText: "${MEDICATION_NAME}"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    point: "334,287"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*${MEDICATION_NAME}.*"
    timeout: 60000

# Wait for enrichment to complete
- extendedWaitUntil:
    visible: ".*ตั้งค่า Override.*"
    timeout: 15000

# Dismiss keyboard
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 3000

# ✅ Verify Override badge still present (override persists)
- assertVisible: ".*Override องค์กร.*"

# ✅ Verify fallback_system banner: "ดูแลโดย System Admin"
- extendedWaitUntil:
    visible: ".*ดูแลโดย System Admin.*"
    timeout: 15000
- assertVisible: ".*ดูแลโดย System Admin.*"

# ═══════════════════════════════════════════
# POST-TEST CLEANUP (Manual)
# ═══════════════════════════════════════════
# ⛔ After test: Set is_active = true for apisek in Supabase Dashboard
