# Scenario 13: Prescription Editor แสดง Personal Override Badge
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# Tests that Prescription Editor shows Personal Override badge (🟣) when a
# medication has both Org and Personal Override — Personal wins by merge priority.
#
# Prerequisites:
#   - User "apisek" (id: 341cbf8b, profession_id: 0a8e7857) must have:
#     is_active = true, is_provider = true, can_manage_drug_risk = true
#   - Medication "BOOTS PARACETAMOL" (id: 93f3d4ad) must have BOTH:
#     * Organization Override (user_id IS NULL, profession_id = 0a8e7857, FDA = S)
#     * Personal Override (user_id = 341cbf8b, FDA = P)
#   - Personal Override should win over Org Override (merge priority: Personal > Org)
#   - An in_progress consultation must exist for apisek (id: 59294c78)
#   - Flow: Drawer → คำขอโปรแกรมรักษา → HealthProgramRequestDashboard
#     → แท็บกำลังดำเนินการ → เข้าห้องแชทผู้ป่วย → ChartBoardPage
#     → Medical Tools → ออกใบสั่งยา → PrescriptionEditorPage
#
# Expected:
#   - Drug risk screening dialog shows "Override ส่วนตัว" badge (not "Override องค์กร")
#   - FDA status reflects Personal Override value (P) not the Org Override (S)
#   - Note: FDA status P blocks telemedicine because override_is_telemedicine_prohibited = true
#   - Note: Medical tools icon is at bottom-left of ChartBoardPage (a11y: "เครื่องมือแพทย์"), not top-right
#
# Run:
#   maestro test docs/guides/scenario_13_personal_override_badge.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6

appId: com.example.treeLawZoo
env:
  DOCTOR_USERNAME: "apisek"
  DOCTOR_PASSWORD: "123456"
  MEDICATION_SEARCH: "Paracetamol"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and login as doctor (apisek)
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo
    clearState: true

- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"

- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 2: Navigate to Health Program Request Dashboard
# ═══════════════════════════════════════════
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

- tapOn: "คำขอโปรแกรมรักษา"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: "กำลังดำเนินการ"
    timeout: 30000
- tapOn: "กำลังดำเนินการ"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*เข้าห้องแชทผู้ป่วย.*"
    timeout: 30000
- tapOn: ".*เข้าห้องแชทผู้ป่วย.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ถามผู้เชี่ยวชาญ.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 3: Open medical tools → Prescription Editor
# ═══════════════════════════════════════════
# Tap the medical tools icon at the bottom-left of ChartBoardPage
- tapOn: "เครื่องมือแพทย์"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*ออกใบสั่งยา.*"
    timeout: 10000

- tapOn: ".*ออกใบสั่งยา.*"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible: ".*ชื่อยา.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 4: Add medication with Personal Override
# ═══════════════════════════════════════════
- tapOn:
    text: ".*ชื่อยา.*"
- waitForAnimationToEnd:
    timeout: 1000

- inputText: "${MEDICATION_SEARCH}"
- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: ".*BOOTS PARACETAMOL.*"
    timeout: 10000

- tapOn:
    text: ".*BOOTS PARACETAMOL.*"
- waitForAnimationToEnd:
    timeout: 2000

# ═══════════════════════════════════════════
# Step 5: Submit prescription to trigger screening
# ═══════════════════════════════════════════
# Keyboard may or may not be visible; dismiss if present
- tapOn:
    id: "Done"
- waitForAnimationToEnd:
    timeout: 2000

# Submit button is at the bottom of the form
- tapOn: "บันทึก & ส่งใบสั่งยา"
- waitForAnimationToEnd:
    timeout: 5000

# ═══════════════════════════════════════════
# Step 6: Verify drug risk screening dialog with Personal Override badge
# ═══════════════════════════════════════════
- extendedWaitUntil:
    visible: ".*BOOTS PARACETAMOL.*"
    timeout: 15000

# ✅ Verify "Override ส่วนตัว" badge is shown (Personal wins over Org)
- assertVisible: ".*Override ส่วนตัว.*"

# Close dialog
- tapOn:
    text: ".*ยกเลิก.*"
