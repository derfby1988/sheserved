# Scenario 3: สมาชิกคลินิก A (ไม่มีสิทธิ์แก้) — can_manage_drug_risk = false
# Device: iPhone 16 Simulator (A692F954-72BF-4D54-9557-FB61BCB5DBA6) — iOS 18.1
#
# This flow logs in with a clinic member account that has can_manage_drug_risk = false,
# then verifies that:
#   1. The "การจัดการยา" menu group is NOT visible in the Drawer
#   2. The "จัดการหมวดหมู่ความเสี่ยงยา" menu item is NOT accessible
#   3. Login is successful (verified by "ออกจากระบบ" in Drawer)
#
# ⚠️ ข้อจำกัด: ขั้นตอนที่ 4-5 ในแผน (ไปหน้า Prescription Editor และตรวจสอบ Override Badge)
#    ไม่สามารถทดสอบอัตโนมัติได้ เนื่องจาก PrescriptionEditorPage ต้องเข้าผ่าน
#    consultation context (ChatRoom → "ออกใบสั่งยา" หรือ ChartBoard → _viewPrescriptionDetails)
#    ซึ่งต้องมี consultation request ที่ active ก่อน
#    → ต้องทดสอบขั้นตอนนี้ด้วย Manual Testing
#
# Prerequisites:
#   - App is installed on the simulator (flutter run -d A692F954-72BF-4D54-9557-FB61BCB5DBA6)
#   - Network connectivity to Supabase backend
#   - User "firm" must have professionId != null (same clinic as "apisek")
#   - User "firm" must have can_manage_drug_risk = false in professions table
#   - Organization Override for Paracetamol must exist (set by "apisek" in Scenario 2)
#
# Credentials:
#   - Member (no drug risk permission): firm / 123456
#
# Run:
#   maestro test docs/guides/scenario_03_member_no_permission.yaml --udid A692F954-72BF-4D54-9557-FB61BCB5DBA6
#
# References:
#   - docs/plans/DRUG_RISK_OVERRIDE_PLAN.md §8.1 Scenario 3
#   - lib/shared/widgets/tlz_drawer.dart (Drawer gating via _canManageDrugRisk, line 591)
#   - lib/features/pharmacy/presentation/pages/drug_risk_classification_admin_page.dart

appId: com.example.treeLawZoo
env:
  MEMBER_USERNAME: "firm"
  MEMBER_PASSWORD: "123456"
---
# ═══════════════════════════════════════════
# Step 1: Launch app and navigate to login
# ═══════════════════════════════════════════
- launchApp:
    appId: com.example.treeLawZoo

# Wait for home page to load (guest mode)
- extendedWaitUntil:
    visible: "ค้นหายา ร้านยา หมอ..."
    timeout: 30000

# Navigate to login via bottom nav bar donation tab (index 1)
# MainAppLayout redirects unauthenticated users to /login when tapping donation tab
- runFlow:
    file: _shared_login.yaml
    env:
      USERNAME: "${USERNAME}"
      PASSWORD: "${PASSWORD}"
- extendedWaitUntil:
    visible:
      text: "ค้นหายา ร้านยา หมอ..."
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000

# ═══════════════════════════════════════════
# Step 3: Verify login success by checking Drawer
# ═══════════════════════════════════════════
# ⚠️ หน้า home ไม่ได้ยืนยันว่า login สำเร็จ (guest mode ก็แสดง home ได้)
# ต้องเปิด Drawer และตรวจสอบว่าเห็น "ออกจากระบบ" (ไม่ใช่ "ลงชื่อเข้าใช้")

# Open drawer
- tapOn:
    point: "38,95"
- waitForAnimationToEnd:
    timeout: 3000

# Scroll to bottom of drawer to see login/logout menu item
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# ✅ Verify login success: must see "ออกจากระบบ" (not "ลงชื่อเข้าใช้")
- assertVisible: "ออกจากระบบ"

# ═══════════════════════════════════════════
# Step 4: Verify "การจัดการยา" menu group is NOT visible
# ═══════════════════════════════════════════
# Drawer gating: _canManageDrugRisk = false → entire "การจัดการยา" group is hidden
# (tlz_drawer.dart line 591: if (_canManageDrugRisk) ...[)

# Scroll back up to check for drug management menu
- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 2000

# ✅ Verify "จัดการหมวดหมู่ความเสี่ยงยา" is NOT visible
- assertNotVisible: "จัดการหมวดหมู่ความเสี่ยงยา"

# ✅ Verify "การจัดการยา" group header is NOT visible
- assertNotVisible: "การจัดการยา"

# ═══════════════════════════════════════════
# Step 5: Close drawer and verify app is still functional
# ═══════════════════════════════════════════
# Close drawer by tapping outside (right side of screen)
- tapOn:
    point: "370,400"
- waitForAnimationToEnd:
    timeout: 2000

# Verify we're back on home page
- assertVisible: "ค้นหายา ร้านยา หมอ..."

# ═══════════════════════════════════════════
# Step 6: (Manual Test Required) Prescription Editor Override Badge
# ═══════════════════════════════════════════
# ขั้นตอนนี้ไม่สามารถทดสอบอัตโนมัติด้วย Maestro ได้ เนื่องจาก:
# - PrescriptionEditorPage ต้องเข้าผ่าน consultation context
#   (ChatRoom → "ออกใบสั่งยา" หรือ ChartBoard → _viewPrescriptionDetails)
# - ต้องมี consultation request ที่ active ก่อน
#
# วิธีทดสอบ Manual:
# 1. สร้าง consultation request (หรือใช้ที่มีอยู่)
# 2. เปิด ChatRoom → กดปุ่มเครื่องมือแพทย์ → "ออกใบสั่งยา (Prescription)"
# 3. ค้นหาและเพิ่มยา Paracetamol (ที่คลินิกตั้ง Override ไว้ใน Scenario 2)
# 4. ตรวจสอบว่า Paracetamol แสดง Badge 🔵 (Organization Override)
# 5. ยืนยันว่าผู้ใช้ไม่สามารถแก้ไข Override ได้ (ไม่มีปุ่ม "ตั้งค่า Override")
