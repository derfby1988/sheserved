# =============================================================
# NGINX Reverse Proxy Config — Option D: Edge Rate Limiting
# ใช้กับ: docs/secure/03_rate_limiting_resource_exhaustion.md
#
# วิธีใช้:
#   1. คัดลอกไฟล์นี้ไปยัง /etc/nginx/sites-available/sheserved
#   2. ln -s /etc/nginx/sites-available/sheserved /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# แยก zone ตามประเภท traffic:
#   - api_read:   public read endpoints (10 r/s, burst 20)
#   - api_auth:   login/register/OTP (2 r/s, burst 5)
#   - api_upload: file upload (1 r/s, burst 3)
#   - api_admin:  admin endpoints (5 r/s, burst 10)
#   - ws:         WebSocket handshake (5 r/s, burst 10)
#   - emergency:  emergency endpoints (20 r/s, burst 50 — ต้องไม่บล็อกฉุกเฉิน)
# =============================================================

# Rate limit zones — แยกตามประเภท traffic
limit_req_zone $binary_remote_addr zone=api_read:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_admin:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=ws:10m         rate=5r/s;
limit_req_zone $binary_remote_addr zone=emergency:10m  rate=20r/s;

# Connection limit zone
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Trusted proxy chain — ปรับตาม infrastructure จริง
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ─── Global connection limit ───────────────────────────────
    limit_conn conn_per_ip 20;

    # ─── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Real-IP $remote_addr;

    # ─── Request body limits ───────────────────────────────────
    # ค่าเริ่มต้น 10MB สำหรับ API ทั่วไป
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ─── Auth endpoints (login, register, OTP) ─────────────────
    location ~ ^/api/(auth|login|register|otp|verify|reset) {
        limit_req zone=api_auth burst=5 nodelay;
        client_max_body_size 1m;
        proxy_pass http://nodejs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Upload endpoints ──────────────────────────────────────
    location ~ ^/api/.*upload {
        limit_req zone=api_upload burst=3 nodelay;
        client_max_body_size 25m;
        client_body_timeout 120s;
        proxy_pass http://nodejs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Emergency endpoints — ต้องไม่บล็อกฉุกเฉิน ─────────────
    location ~ ^/api/.*emergency {
        limit_req zone=emergency burst=50 nodelay;
        proxy_pass http://nodejs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Admin endpoints ───────────────────────────────────────
    location ~ ^/api/(admin|users|applications|professions/sync) {
        limit_req zone=api_admin burst=10 nodelay;
        proxy_pass http://nodejs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket upgrade ─────────────────────────────────────
    location /socket.io/ {
        limit_req zone=ws burst=10 nodelay;
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Static video files ────────────────────────────────────
    location /videos/ {
        limit_req zone=api_read burst=20 nodelay;
        alias /var/www/sheserved/temp/videos/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Default API (read endpoints) ──────────────────────────
    location /api/ {
        limit_req zone=api_read burst=20 nodelay;
        proxy_pass http://nodejs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (no rate limit) ──────────────────────────
    location /health {
        proxy_pass http://nodejs_backend;
        access_log off;
    }

    # ─── Custom 429 response ───────────────────────────────────
    error_page 429 = @ratelimit;
    location @ratelimit {
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"เกินจำนวน request ที่อนุญาต","retryAfter":60}';
    }
}
